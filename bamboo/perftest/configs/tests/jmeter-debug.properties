# Sample file for running JMeter locally for debugging purposes.

# To use this, open a terminal in the current directory of this file
# and start JMeter with the command:
#
#   jmeter -p jmeter-debug.properties
#
# or for running a test headless:
#
#   jmeter -p jmeter-debug.properties -n -t <testfile.jmx>

# The search_paths key is a classpath to search for JMeter plugin jar files.
# It should not be used for other dependency jars, such as JDBC drivers.
# Directories or files are separated by a semicolon (;).
search_paths=supportFiles;

# The user.classpath is used for dependency jars, not plugins jars (which must
# go in the search_paths instead).
# Directories or files are separated by a colon (:).
# The classpath cannot end in '*' like a typical Java classpath. Instead, specify
# the directory and JMeter will pick all the jar files in that path.
user.classpath=../../../../shell:

# The JDBC URL to use when running locally.
JDBC_URL=jdbc:se://localhost:9123

# If an output file (e.g. for results) exists then don't ask the
# user what to do. Just delete the file before writing the new one.
# This applies when executing tests via the JMeter GUI.
# Valid options are ASK, APPEND or DELETE.
resultcollector.action_if_file_exists=DELETE