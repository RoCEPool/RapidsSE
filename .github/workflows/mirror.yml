name: mirror
# RapidsSE from Bitbucket into this repository: every branch and tag, add-only
# (README.md says what that means), and a git bundle of it all on the release "backup"
on:
  push:
    branches: [mirror-sync]
  schedule:
    - cron: "17 18 * * *"   # daily, 03:17 Tokyo
  workflow_dispatch:
permissions:
  contents: write
concurrency: mirror
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      UPSTREAM: https://bitbucket.org/rapidsdataproject/rapidsse.git
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: fetch upstream
        id: up
        run: |
          if ! git clone -q --mirror "$UPSTREAM" up.git 2> err.txt; then
            echo "::warning title=upstream unreachable::$(tr '\n' ' ' < err.txt) -- nothing changed here"
            echo "ok=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=1" >> "$GITHUB_OUTPUT"
          echo "upstream: $(git -C up.git for-each-ref refs/heads | wc -l) branches, $(git -C up.git tag | wc -l) tags, $(git -C up.git rev-list --all --count) commits"
      - name: push branches and tags (add-only)
        if: steps.up.outputs.ok == '1'
        run: |
          cd up.git
          git remote add gh "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          d=$(date -u +%Y%m%d)
          fail=0
          # (the default branch first)
          for b in master $(git for-each-ref --format='%(refname:strip=2)' refs/heads/ | grep -vx master); do
            [ "$b" = mirror-sync ] && continue
            if ! git push -q gh "refs/heads/$b:refs/heads/$b" 2> err.txt; then
              if grep -qiE "non-fast-forward|fetch first|rejected" err.txt; then
                # upstream rewrote this branch: ours stays, theirs goes beside it
                git push -q gh "refs/heads/$b:refs/heads/upstream-rewritten/$d/$b" 2>> err.txt || true
                echo "::warning title=branch rewritten upstream::$b -- kept, upstream's is upstream-rewritten/$d/$b"
              else
                echo "::error title=push $b::$(tr '\n' ' ' < err.txt)"; fail=1
              fi
            fi
          done
          for t in $(git tag); do
            if ! git push -q gh "refs/tags/$t:refs/tags/$t" 2> err.txt; then
              if grep -qiE "already exists|rejected" err.txt; then
                git push -q gh "refs/tags/$t:refs/tags/$t-upstream-$d" 2>> err.txt || true
                echo "::warning title=tag changed upstream::$t -- kept, upstream's is $t-upstream-$d"
              else
                echo "::error title=push tag $t::$(tr '\n' ' ' < err.txt)"; fail=1
              fi
            fi
          done
          exit $fail
      - name: LFS objects (into this repository's LFS and the release "backup")
        if: steps.up.outputs.ok == '1'
        run: |
          # The build needs files stored in Git LFS upstream (thirdparty/*.tar.gz,
          # jars, ...). A plain mirror clone has only their pointers, so copy the
          # objects too: into GitHub LFS (so `git lfs pull` works on a clone of
          # this repository) and, as a second copy outside any LFS quota, as one
          # tar file on the release.
          cd up.git
          git lfs install --local > /dev/null
          git remote add gh "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
          git config lfs.https://github.com/${GITHUB_REPOSITORY}.git/info/lfs.locksverify false
          warn() { echo "::warning title=$1::$(tail -5 ../lfs_err.txt | tr '\n' ' ')"; }
          # 1. what each branch tip needs (what a clone builds from), first:
          #    a time-out in step 2 must not lose it
          # (the default branch first)
          for b in master $(git for-each-ref --format='%(refname:strip=2)' refs/heads/ | grep -vx master); do
            timeout 15m git lfs fetch origin "$b" 2> ../lfs_err.txt || warn "LFS fetch $b"
            git lfs push gh "$b" 2> ../lfs_err.txt || warn "LFS push $b"
          done
          # 2. every older object too, as far as the time allows (resumed next run)
          timeout 70m git lfs fetch --all origin 2> ../lfs_err.txt || warn "LFS fetch --all (the next run tries again)"
          n=$(find lfs/objects -type f 2>/dev/null | wc -l)
          echo "::notice title=LFS::$n objects, $(du -sh lfs/objects 2>/dev/null | cut -f1)"
          [ "$n" -gt 0 ] || exit 0
          git lfs push --all gh 2> ../lfs_err.txt || warn "LFS push --all (the release copy still has them)"
          tar -cf ../rapidsse-lfs.tar lfs/objects
      - name: backup bundle on the release "backup"
        if: steps.up.outputs.ok == '1'
        run: |
          # every failure says why, as an annotation (readable without the raw log)
          run() { if ! out=$("$@" 2>&1); then echo "::error title=backup: $1 $2::$(echo "$out" | tail -5 | tr '\n' ' ')"; exit 1; fi; }
          run git -C up.git bundle create "$PWD/rapidsse.bundle" --all
          run git -C up.git bundle verify "$PWD/rapidsse.bundle"
          size=$(stat -c %s rapidsse.bundle)
          echo "::notice title=bundle::$((size / 1048576)) MiB"
          if [ "$size" -ge 2000000000 ]; then
            # a release file may not exceed 2 GiB: split it, the notes say how to join
            split -b 1900m -d rapidsse.bundle rapidsse.bundle.part
            files=$(ls rapidsse.bundle.part*)
            join="cat rapidsse.bundle.part* > rapidsse.bundle && "
          else
            files=rapidsse.bundle
            join=""
          fi
          notes="The whole RapidsSE repository (every branch and tag, full history) as of $(date -u '+%Y-%m-%d %H:%M UTC'), from $UPSTREAM. Restore: \`${join}git clone rapidsse.bundle rapidsse\`."
          if ! gh release view backup -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            run gh release create backup -R "$GITHUB_REPOSITORY" --target mirror-sync --title "Backup: the whole repository in one file" --notes "$notes" --latest=false
          fi
          if [ -f rapidsse-lfs.tar ]; then
            if [ "$(stat -c %s rapidsse-lfs.tar)" -ge 2000000000 ]; then
              split -b 1900m -d rapidsse-lfs.tar rapidsse-lfs.tar.part && rm rapidsse-lfs.tar
            fi
            files="$files $(ls rapidsse-lfs.tar*)"
            notes="$notes LFS objects (build tarballs, jars, ...): \`rapidsse-lfs.tar\` (join parts with cat first); \`tar -xf rapidsse-lfs.tar -C rapidsse/.git && git -C rapidsse lfs checkout\`."
          fi
          run gh release upload backup $files -R "$GITHUB_REPOSITORY" --clobber
          run gh release edit backup -R "$GITHUB_REPOSITORY" --notes "$notes"
