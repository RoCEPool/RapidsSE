[loggers]
keys=root

[logger_root]
handlers=logfile,logconsole
level=DEBUG

[formatters]
keys=common

[formatter_common]
format=%(asctime)s: %(name)-30s: %(levelname)s: %(message)s

[handlers]
keys=logfile,logconsole

[handler_logfile]
class=FileHandler
args=('septest.log', 'w')
formatter=common

[handler_logconsole]
class=StreamHandler
args=(sys.stdout,)
formatter=common
