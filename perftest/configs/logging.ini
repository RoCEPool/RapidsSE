[loggers]
keys=root,botocore,urllib3,psycopg

[logger_root]
handlers=logfile,logconsole
level=DEBUG

[formatters]
keys=common

[formatter_common]
format=%(asctime)s: %(name)-30s: %(levelname)s: %(message)s

[handlers]
keys=logfile,logconsole

[handler_logfile]
class=FileHandler
args=('septest.log', 'w')
formatter=common

[handler_logconsole]
class=StreamHandler
args=(sys.stdout,)
formatter=common

# # # # # # # # # # # # # # # # # # # # #
# IGNORING THESE LOGGERS
# # # # # # # # # # # # # # # # # # # # #

[logger_botocore]
level=WARN
handlers=logfile,logconsole
qualname=botocore
propagate=0

[logger_urllib3]
level=WARN
handlers=logfile,logconsole
qualname=urllib3
propagate=0

[logger_psycopg]
level=WARN
handlers=logfile,logconsole
qualname=psycopg.pq
propagate=0