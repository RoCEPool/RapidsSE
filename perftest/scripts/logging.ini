[loggers]
keys=root

[logger_root]
level=DEBUG
handlers=logfile,logconsole

[formatters]
keys=common

[formatter_common]
format=%(asctime)s %(name)-12s: %(levelname)s: %(message)s

[handlers]
keys=logfile,logconsole

[handler_logfile]
class=FileHandler
level=NOTSET
args=('septest.log', 'w')
formatter=common

[handler_logconsole]
class=StreamHandler
args=(sys.stdout,)
formatter=common
